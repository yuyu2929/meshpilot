<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshPilot — 自动驾驶式 3D 资产优化</title>
<style>
  :root {
    --bg: #0f1219; --panel: #171c28; --line: #2a3244;
    --text: #e8ecf3; --dim: #8b95a8; --accent: #4f8ef7;
    --ok: #3ecf8e; --warn: #f7b84f; --bad: #f75f5f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  h1 .tag { color: var(--accent); }
  .sub { color: var(--dim); margin-bottom: 28px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  select, input { background: #0d1017; color: var(--text);
                  border: 1px solid var(--line); border-radius: 6px;
                  padding: 8px 10px; font-size: 14px; }
  button { background: var(--accent); color: #fff; border: none;
           border-radius: 6px; padding: 9px 22px; font-size: 14px;
           cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
           gap: 12px; margin: 16px 0; }
  .card { background: #0d1017; border: 1px solid var(--line);
          border-radius: 8px; padding: 14px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .card .d { font-size: 12px; margin-top: 2px; }
  .good { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
           font-size: 13px; }
  th { color: var(--dim); font-weight: 500; }
  .step { border-left: 3px solid var(--accent); padding: 6px 14px;
          margin: 10px 0; background: #0d1017; border-radius: 0 6px 6px 0; }
  .step .act { font-weight: 600; }
  .step .note { color: var(--dim); font-size: 13px; }
  .step .why { color: #b8c2d4; font-size: 12px; margin-top: 2px; }
  .bar-row { display: grid; grid-template-columns: 90px 1fr 70px;
             gap: 10px; align-items: center; margin: 6px 0; font-size: 13px; }
  .bar-track { background: #0d1017; border-radius: 4px; height: 18px;
               position: relative; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .hidden { display: none; }
  #err { color: var(--bad); margin-top: 10px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px;
          font-size: 12px; border: 1px solid var(--line); color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>MeshPilot <span class="tag">— 自动驾驶式 3D 资产优化</span></h1>
  <p class="sub">诊断拓扑 → 开优化处方 → 执行流水线 → 按预算验收。核心算法 MIT 开源。</p>

  <div class="panel">
    <div class="row">
      <div>
        <label>演示网格</label>
        <select id="mesh">
          <option value="noisy_sphere(4)">noisy_sphere(4) — 扫描噪声球</option>
          <option value="icosphere(4)">icosphere(4) — 光滑球</option>
          <option value="torus">torus — 环面（亏格 1）</option>
        </select>
      </div>
      <div>
        <label>面数预算</label>
        <input id="budget" type="number" value="800" min="4" step="50" style="width:110px">
      </div>
      <div>
        <label>最大表面偏差（相对对角线）</label>
        <input id="chamfer" type="number" value="0.01" step="0.005" min="0.001" style="width:110px">
      </div>
      <button id="go">开始优化</button>
      <span class="pill" id="lic">许可：社区版</span>
    </div>
    <div id="err"></div>
  </div>

  <div id="result" class="hidden">
    <div class="panel">
      <h3 style="margin-bottom:6px">体检与结果</h3>
      <div class="cards" id="cards"></div>
      <div id="bars"></div>
    </div>

    <div class="panel">
      <h3 style="margin-bottom:6px">Agent 执行剧本</h3>
      <div id="steps"></div>
    </div>

    <div class="panel">
      <h3 style="margin-bottom:6px">验收</h3>
      <div id="verify"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

async function loadLicense() {
  try {
    const r = await fetch('/api/license').then(r => r.json());
    $('lic').textContent = '许可：' + r.tier + (r.org ? ' · ' + r.org : '');
  } catch (e) {}
}

function card(k, v, cls, d) {
  return `<div class="card"><div class="k">${k}</div>
    <div class="v ${cls || ''}">${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`;
}

function esc(s) {
  // 服务端字符串一律转义后再拼进 innerHTML：目前数据源是固定网格，
  // 但一旦有人把"上传网格"接进来，未转义就是存储型 XSS。
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]
  ));
}

function bar(label, before, after, max, unit) {
  const bw = Math.max(2, before / max * 100), aw = Math.max(2, after / max * 100);
  return `<div class="bar-row"><span>${esc(label)}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${bw}%;background:#3a4661"></div></div>
    <span>${esc(before)}${esc(unit)}</span></div>
    <div class="bar-row"><span></span>
    <div class="bar-track"><div class="bar-fill" style="width:${aw}%;background:var(--accent)"></div></div>
    <span>${esc(after)}${esc(unit)}</span></div>`;
}

$('go').onclick = async () => {
  $('err').textContent = '';
  $('go').disabled = true;
  $('go').textContent = '优化中…';
  try {
    const r = await fetch('/api/optimize', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        mesh: $('mesh').value,
        budget_faces: parseInt($('budget').value),
        chamfer: parseFloat($('chamfer').value),
      })
    }).then(r => r.json());
    if (r.error) { $('err').textContent = r.error; return; }
    render(r);
  } catch (e) { $('err').textContent = String(e); }
  finally { $('go').disabled = false; $('go').textContent = '开始优化'; }
};

function render(r) {
  $('result').classList.remove('hidden');
  const b = r.before, a = r.after, v = r.verification;
  const reduction = b.n_faces ? (100 * (1 - a.n_faces / b.n_faces)).toFixed(1) : 0;
  $('cards').innerHTML =
    card('面数', a.n_faces, 'good', `原 ${b.n_faces}（-${reduction}%）`) +
    card('顶点数', a.n_vertices, 'good', `原 ${b.n_vertices}`) +
    card('闭合网格', a.closed ? '是' : '否', a.closed ? 'good' : 'warn') +
    card('欧拉数', a.euler_characteristic, '', `原 ${b.euler_characteristic}`) +
    card('非流形边', a.nonmanifold_edges, a.nonmanifold_edges ? 'bad' : 'good', `原 ${b.nonmanifold_edges}`) +
    card('退化面', a.degenerate_faces, a.degenerate_faces ? 'bad' : 'good', `原 ${b.degenerate_faces}`);

  const maxF = Math.max(b.n_faces, r.budget.faces);
  $('bars').innerHTML =
    bar('面数', b.n_faces, a.n_faces, maxF, '') +
    bar('顶点', b.n_vertices, a.n_vertices, Math.max(b.n_vertices, 1), '');

  $('steps').innerHTML = r.steps.length ? r.steps.map(s =>
    `<div class="step"><div class="act">${esc(s.action)}</div>
     <div class="note">${esc(s.note || '')}</div>
     <div class="why">${esc(s.rationale)}</div></div>`).join('')
    : '<p style="color:var(--dim)">资产已在预算内，无需优化。</p>';

  const c = v.checks || {};
  const ok = v => v ? '<span class="good">✓ 通过</span>' : '<span class="bad">✗ 未通过</span>';
  $('verify').innerHTML = `<table>
    <tr><th>检查项</th><th>实际</th><th>预算</th><th>结果</th></tr>
    <tr><td>面数</td><td>${v.faces}</td><td>${v.budget_faces}</td><td>${ok(c.faces_within_budget)}</td></tr>
    <tr><td>表面偏差</td><td>${(v.chamfer_norm ?? 0).toFixed(5)}</td>
        <td>${v.budget_chamfer_norm}</td><td>${ok(c.chamfer_within_budget)}</td></tr>
    <tr><td>覆盖率</td><td colspan="2">${((v.coverage ?? 0) * 100).toFixed(1)}%</td>
        <td>—</td></tr>
    </table>`;
}

loadLicense();
</script>
</body>
</html>
